# ==============================================================================
# SWAMIDATT FOOTWEAR ERP POS Billing System - Render Blueprint Configuration
# ==============================================================================

services:
  # 1. Flask REST Backend Service
  - type: web
    name: swamidatt-footwear-backend
    runtime: python
    region: singapore # or oregon / frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajay-footwear-postgres
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://swamidatt-footwear-frontend.onrender.com"

  # 2. React + Vite Frontend Static Site
  - type: web
    name: swamidatt-footwear-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://swamidatt-footwear-backend.onrender.com/api

databases:
  # 3. PostgreSQL Database
  - name: ajay-footwear-postgres
    region: singapore
    plan: free
    databaseName: ajay_footwear
    user: postgres
